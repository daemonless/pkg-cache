# dbuild configuration file
# Place in .daemonless/config.yaml or .dbuild.yaml (higher priority)
#
# Full reference: https://github.com/daemonless/dbuild

build:
  architectures:
    - amd64
    - aarch64
  variants:
    - tag: latest
      containerfile: Containerfile
      default: true
      tag_desc: "**daemonless Appliance**. Managed FreeBSD pkg cache proxy built on nginx-base."

cit:
  mode: screenshot
  port: 80
  health: /healthz
  puid: false
  ready: "\\[pkg-cache\\]"
